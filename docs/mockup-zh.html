<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Merchart 界面示意图</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 780px; }
  body {
    background: #191919;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    color: #dcddde;
  }
  .modal {
    width: 1120px; height: 700px;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 12px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 196px 1fr;
    grid-template-rows: 1fr auto;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
    position: relative;
  }
  .side { border-right: 1px solid #2f2f2f; background: #232323; display: flex; flex-direction: column; min-height: 0; }
  .search { display: flex; align-items: center; gap: 7px; padding: 16px 14px 12px; }
  .search svg { width: 14px; height: 14px; stroke: #6b6b6b; fill: none; stroke-width: 2; }
  .search span { font-size: 13px; color: #6b6b6b; }
  .list { flex: 1; overflow: hidden; padding: 0 8px 12px; }
  .item { padding: 7px 10px; border-radius: 6px; margin-bottom: 2px; }
  .item .n { font-size: 13px; line-height: 1.35; color: #dcddde; }
  .item .e { font-size: 10px; color: #6b6b6b; letter-spacing: .02em; margin-top: 1px; }
  .item.on { background: #7c3aed; }
  .item.on .n, .item.on .e { color: #fff; }

  .main { display: flex; flex-direction: column; padding: 16px 20px 12px; gap: 9px; min-height: 0; }
  .head { display: flex; align-items: baseline; gap: 9px; }
  .head .title { font-size: 14.5px; font-weight: 600; }
  .head .hint { font-size: 11.5px; color: #9a9a9a; }
  .input {
    height: 132px; border: 1px solid #383838; border-radius: 8px;
    padding: 9px 11px; font-family: Consolas, "Courier New", monospace;
    font-size: 12.5px; line-height: 1.62; color: #cfcfcf; background: #1a1a1a;
    white-space: pre;
  }
  .rules { font-size: 11px; color: #8a8a8a; }
  .rules .q { display: inline-flex; align-items: center; gap: 5px; }
  .rules .q i {
    width: 13px; height: 13px; border-radius: 50%; border: 1px solid #6b6b6b;
    display: inline-grid; place-items: center; font-style: normal; font-size: 9px; color: #6b6b6b;
  }
  .preview { flex: 1; min-height: 0; border-top: 1px solid #2f2f2f; padding-top: 8px; display: flex; flex-direction: column; }
  .plabel { font-size: 10.5px; color: #6b6b6b; letter-spacing: .06em; margin-bottom: 8px; }
  .canvas { flex: 1; display: flex; align-items: center; justify-content: center; }

  .foot {
    grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
    padding: 9px 34px 9px 18px; border-top: 1px solid #2f2f2f; background: #1e1e1e;
  }
  .warn { font-size: 11px; color: #8a8a8a; }
  .acts { display: flex; gap: 8px; align-items: center; }
  .btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #3a3a3a; font-size: 12.5px; color: #dcddde; }
  .btn.primary {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 18px; border: none; font-size: 13px; font-weight: 500;
    background: #7c3aed; color: #fff;
  }
  .kbd { font-size: 10px; opacity: .75; border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; }
  .resizer {
    position: absolute; right: 0; bottom: 0; width: 22px; height: 22px;
    background-image: linear-gradient(135deg, transparent 46%, #5a5a5a 46%, #5a5a5a 54%, transparent 54%),
                      linear-gradient(135deg, transparent 66%, #5a5a5a 66%, #5a5a5a 74%, transparent 74%);
  }
</style>
</head>
<body>
<div class="modal">
  <div class="side">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span>搜索图类型</span>
    </div>
    <div class="list">
      <div class="item on"><div class="n">流程图</div><div class="e">Flowchart</div></div>
      <div class="item"><div class="n">思维导图</div><div class="e">Mindmap</div></div>
      <div class="item"><div class="n">时间线</div><div class="e">Timeline</div></div>
      <div class="item"><div class="n">时序图</div><div class="e">Sequence</div></div>
      <div class="item"><div class="n">类图</div><div class="e">Class</div></div>
      <div class="item"><div class="n">状态图</div><div class="e">State</div></div>
      <div class="item"><div class="n">实体关系图</div><div class="e">ER Diagram</div></div>
      <div class="item"><div class="n">甘特图</div><div class="e">Gantt</div></div>
      <div class="item"><div class="n">饼图</div><div class="e">Pie</div></div>
      <div class="item"><div class="n">象限图</div><div class="e">Quadrant</div></div>
      <div class="item"><div class="n">用户旅程</div><div class="e">Journey</div></div>
      <div class="item"><div class="n">看板</div><div class="e">Kanban</div></div>
      <div class="item"><div class="n">树图</div><div class="e">Treemap</div></div>
      <div class="item"><div class="n">雷达图</div><div class="e">Radar</div></div>
    </div>
  </div>

  <div class="main">
    <div class="head">
      <div class="title">流程图</div>
      <div class="hint">缩进表达层级，自动连线</div>
    </div>
    <div class="input">提交申请
  资料审核
    通过: 进入排期
    退回: 补充材料
  安排执行</div>
    <div class="rules"><span class="q"><i>?</i>语法提示</span></div>
    <div class="preview">
      <div class="plabel">预览</div>
      <div class="canvas">
        <svg width="470" height="300" viewBox="0 0 470 300">
          <defs>
            <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
              <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8a8a"/>
            </marker>
          </defs>
          <g font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="13">
            <rect x="175" y="10" width="118" height="38" rx="5" fill="#2a2a2a" stroke="#5a5a5a"/>
            <text x="234" y="34" fill="#e4e4e4" text-anchor="middle">提交申请</text>

            <rect x="175" y="94" width="118" height="38" rx="5" fill="#2a2a2a" stroke="#5a5a5a"/>
            <text x="234" y="118" fill="#e4e4e4" text-anchor="middle">资料审核</text>

            <rect x="26" y="182" width="126" height="38" rx="5" fill="#2a2a2a" stroke="#5a5a5a"/>
            <text x="89" y="206" fill="#e4e4e4" text-anchor="middle">进入排期</text>

            <rect x="316" y="182" width="126" height="38" rx="5" fill="#2a2a2a" stroke="#5a5a5a"/>
            <text x="379" y="206" fill="#e4e4e4" text-anchor="middle">补充材料</text>

            <rect x="175" y="252" width="118" height="38" rx="5" fill="#2a2a2a" stroke="#5a5a5a"/>
            <text x="234" y="276" fill="#e4e4e4" text-anchor="middle">安排执行</text>

            <line x1="234" y1="48" x2="234" y2="88" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#a)"/>
            <path d="M214 132 L110 178" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
            <path d="M254 132 L358 178" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
            <line x1="234" y1="132" x2="234" y2="246" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#a)"/>

            <text x="140" y="150" fill="#9a9a9a" font-size="11.5">通过</text>
            <text x="290" y="150" fill="#9a9a9a" font-size="11.5">退回</text>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <div class="foot">
    <div class="warn"></div>
    <div class="acts">
      <div class="btn">取消</div>
      <div class="btn primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 4v12M6 12l6 6 6-6M4 20h16"/>
        </svg>
        插入图
        <span class="kbd">Ctrl+↵</span>
      </div>
    </div>
  </div>
  <div class="resizer"></div>
</div>
</body>
</html>
