    <line x1="450" y1="756" x2="450" y2="804" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#mc2)"/>
    <path d="M418 892 L292 956" stroke="#8a8a8a" stroke-width="2.2" fill="none" marker-end="url(#mc2)"/>
    <path d="M482 892 L608 956" stroke="#8a8a8a" stroke-width="2.2" fill="none" marker-end="url(#mc2)"/>
    <line x1="450" y1="892" x2="450" y2="1114" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#mc2)"/>

