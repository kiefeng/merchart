<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="1600" fill="#1e1e1e"/>
  <defs>
    <marker id="mc1" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="60" y="108" font-size="34" font-weight="600" fill="#dcddde">流程图</text>
  <g stroke="#9a9a9a" stroke-width="3" stroke-linecap="round">
    <line x1="800" y1="82" x2="824" y2="106"/>
    <line x1="824" y1="82" x2="800" y2="106"/>
  </g>

  <!-- 类型 chips -->
  <g font-size="26">
    <rect x="60" y="152" width="140" height="62" rx="31" fill="#7c3aed"/>
    <text x="130" y="192" fill="#ffffff" text-anchor="middle">流程图</text>
    <rect x="214" y="152" width="170" height="62" rx="31" fill="none" stroke="#3a3a3a"/>
    <text x="299" y="192" fill="#b4b4b4" text-anchor="middle">思维导图</text>
    <rect x="398" y="152" width="140" height="62" rx="31" fill="none" stroke="#3a3a3a"/>
    <text x="468" y="192" fill="#b4b4b4" text-anchor="middle">时间线</text>
    <rect x="552" y="152" width="140" height="62" rx="31" fill="none" stroke="#3a3a3a"/>
    <text x="622" y="192" fill="#b4b4b4" text-anchor="middle">时序图</text>
  </g>

  <!-- 输入框 -->
  <rect x="60" y="252" width="780" height="252" rx="18" fill="#1a1a1a" stroke="#383838"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#cfcfcf">
    <text x="86" y="300">提交申请</text>
    <text x="86" y="344">  资料审核</text>
    <text x="86" y="388">    通过: 进入排期</text>
    <text x="86" y="432">    退回: 补充材料</text>
    <text x="86" y="476">  安排执行</text>
  </g>

  <!-- 语法提示 -->
  <circle cx="74" cy="548" r="13" fill="none" stroke="#6b6b6b"/>
  <text x="80" y="556" font-size="17" fill="#6b6b6b">?</text>
  <text x="100" y="556" font-size="22" fill="#8a8a8a">语法提示</text>

  <!-- 预览 -->
  <line x1="60" y1="596" x2="840" y2="596" stroke="#2f2f2f"/>
  <text x="60" y="638" font-size="20" fill="#6b6b6b" letter-spacing="2">预览</text>

  <g font-size="28">
    <rect x="320" y="676" width="260" height="80" rx="10" fill="#2a2a2a" stroke="#5a5a5a"/>
    <text x="450" y="726" fill="#e4e4e4" text-anchor="middle">提交申请</text>

    <rect x="320" y="812" width="260" height="80" rx="10" fill="#2a2a2a" stroke="#5a5a5a"/>
    <text x="450" y="862" fill="#e4e4e4" text-anchor="middle">资料审核</text>

    <rect x="96" y="962" width="300" height="80" rx="10" fill="#2a2a2a" stroke="#5a5a5a"/>
    <text x="246" y="1012" fill="#e4e4e4" text-anchor="middle">进入排期</text>

    <rect x="504" y="962" width="300" height="80" rx="10" fill="#2a2a2a" stroke="#5a5a5a"/>
    <text x="654" y="1012" fill="#e4e4e4" text-anchor="middle">补充材料</text>

    <rect x="320" y="1122" width="260" height="80" rx="10" fill="#2a2a2a" stroke="#5a5a5a"/>
    <text x="450" y="1172" fill="#e4e4e4" text-anchor="middle">安排执行</text>

    <line x1="450" y1="756" x2="450" y2="804" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#mc1)"/>
    <path d="M418 892 L292 956" stroke="#8a8a8a" stroke-width="2.2" fill="none" marker-end="url(#mc1)"/>
    <path d="M482 892 L608 956" stroke="#8a8a8a" stroke-width="2.2" fill="none" marker-end="url(#mc1)"/>
    <line x1="450" y1="892" x2="450" y2="1114" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#mc1)"/>

    <text x="286" y="940" fill="#9a9a9a" font-size="22">通过</text>
    <text x="566" y="940" fill="#9a9a9a" font-size="22">退回</text>
  </g>

  <!-- 底栏 -->
  <line x1="0" y1="1440" x2="900" y2="1440" stroke="#2f2f2f"/>
  <rect x="372" y="1470" width="196" height="80" rx="14" fill="none" stroke="#3a3a3a"/>
  <text x="470" y="1522" font-size="28" fill="#dcddde" text-anchor="middle">取消</text>

  <rect x="592" y="1462" width="248" height="96" rx="14" fill="#7c3aed"/>
  <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="630" y1="1494" x2="630" y2="1516"/>
    <path d="M620 1508 L630 1519 L640 1508"/>
    <line x1="616" y1="1526" x2="644" y2="1526"/>
  </g>
  <text x="664" y="1518" font-size="28" font-weight="500" fill="#ffffff">插入图</text>
</svg>
