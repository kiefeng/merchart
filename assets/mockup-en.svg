<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="1200" height="780" fill="#191919"/>

  <!-- modal -->
  <rect x="40" y="40" width="1120" height="700" rx="12" fill="#1e1e1e" stroke="#333333"/>
  <clipPath id="clip"><rect x="40" y="40" width="1120" height="700" rx="12"/></clipPath>

  <g clip-path="url(#clip)">
    <!-- sidebar -->
    <rect x="40" y="40" width="196" height="700" fill="#232323"/>
    <line x1="236" y1="40" x2="236" y2="740" stroke="#2f2f2f"/>

    <!-- search -->
    <circle cx="63" cy="71" r="5" fill="none" stroke="#6b6b6b" stroke-width="1.6"/>
    <line x1="66.5" y1="74.5" x2="70" y2="78" stroke="#6b6b6b" stroke-width="1.6"/>
    <text x="80" y="76" font-size="13" fill="#6b6b6b">Search diagram types</text>

    <!-- list -->
    <g font-size="13">
      <rect x="48" y="98" width="180" height="40" rx="6" fill="#7c3aed"/>
      <text x="58" y="115" fill="#ffffff">Flowchart</text>
      <text x="58" y="130" font-size="10" fill="#e8e0ff">流程图</text>

      <text x="58" y="159" fill="#dcddde">Mindmap</text>
      <text x="58" y="174" font-size="10" fill="#6b6b6b">思维导图</text>

      <text x="58" y="203" fill="#dcddde">Timeline</text>
      <text x="58" y="218" font-size="10" fill="#6b6b6b">时间线</text>

      <text x="58" y="247" fill="#dcddde">Sequence</text>
      <text x="58" y="262" font-size="10" fill="#6b6b6b">时序图</text>

      <text x="58" y="291" fill="#dcddde">Class</text>
      <text x="58" y="306" font-size="10" fill="#6b6b6b">类图</text>

      <text x="58" y="335" fill="#dcddde">State</text>
      <text x="58" y="350" font-size="10" fill="#6b6b6b">状态图</text>

      <text x="58" y="379" fill="#dcddde">ER Diagram</text>
      <text x="58" y="394" font-size="10" fill="#6b6b6b">实体关系图</text>

      <text x="58" y="423" fill="#dcddde">Gantt</text>
      <text x="58" y="438" font-size="10" fill="#6b6b6b">甘特图</text>

      <text x="58" y="467" fill="#dcddde">Pie</text>
      <text x="58" y="482" font-size="10" fill="#6b6b6b">饼图</text>

      <text x="58" y="511" fill="#dcddde">Quadrant</text>
      <text x="58" y="526" font-size="10" fill="#6b6b6b">象限图</text>

      <text x="58" y="555" fill="#dcddde">Journey</text>
      <text x="58" y="570" font-size="10" fill="#6b6b6b">用户旅程</text>

      <text x="58" y="599" fill="#dcddde">Kanban</text>
      <text x="58" y="614" font-size="10" fill="#6b6b6b">看板</text>

      <text x="58" y="643" fill="#dcddde">Treemap</text>
      <text x="58" y="658" font-size="10" fill="#6b6b6b">树图</text>
    </g>

    <!-- header -->
    <text x="256" y="80" font-size="14.5" font-weight="600" fill="#dcddde">Flowchart</text>
    <text x="336" y="80" font-size="11.5" fill="#9a9a9a">Indent to nest, arrows connect automatically</text>

    <!-- input -->
    <rect x="256" y="94" width="884" height="132" rx="8" fill="#1a1a1a" stroke="#383838"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#cfcfcf">
      <text x="268" y="116">提交申请</text>
      <text x="268" y="137">  资料审核</text>
      <text x="268" y="158">    通过: 进入排期</text>
      <text x="268" y="179">    退回: 补充材料</text>
      <text x="268" y="200">  安排执行</text>
    </g>

    <!-- syntax help -->
    <circle cx="263" cy="246" r="6.5" fill="none" stroke="#6b6b6b"/>
    <text x="266" y="250" font-size="9" fill="#6b6b6b">?</text>
    <text x="276" y="250" font-size="11" fill="#8a8a8a">Syntax help</text>

    <!-- preview -->
    <line x1="256" y1="268" x2="1140" y2="268" stroke="#2f2f2f"/>
    <text x="256" y="288" font-size="10.5" fill="#6b6b6b" letter-spacing="1">PREVIEW</text>

    <g transform="translate(340, 300)">
      <defs>
        <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
          <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8a8a"/>
        </marker>
      </defs>
      <g font-size="13">
        <rect x="240" y="0" width="120" height="38" rx="5" fill="#2a2a2a" stroke="#5a5a5a"/>
        <text x="300" y="24" fill="#e4e4e4" text-anchor="middle">提交申请</text>

        <rect x="240" y="84" width="120" height="38" rx="5" fill="#2a2a2a" stroke="#5a5a5a"/>
        <text x="300" y="108" fill="#e4e4e4" text-anchor="middle">资料审核</text>

        <rect x="80" y="172" width="130" height="38" rx="5" fill="#2a2a2a" stroke="#5a5a5a"/>
        <text x="145" y="196" fill="#e4e4e4" text-anchor="middle">进入排期</text>

        <rect x="390" y="172" width="130" height="38" rx="5" fill="#2a2a2a" stroke="#5a5a5a"/>
        <text x="455" y="196" fill="#e4e4e4" text-anchor="middle">补充材料</text>

        <rect x="240" y="250" width="120" height="38" rx="5" fill="#2a2a2a" stroke="#5a5a5a"/>
        <text x="300" y="274" fill="#e4e4e4" text-anchor="middle">安排执行</text>

        <line x1="300" y1="38" x2="300" y2="78" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/>
        <path d="M278 122 L170 168" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
        <path d="M322 122 L430 168" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
        <line x1="300" y1="122" x2="300" y2="244" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/>

        <text x="196" y="140" fill="#9a9a9a" font-size="11.5">通过</text>
        <text x="352" y="140" fill="#9a9a9a" font-size="11.5">退回</text>
      </g>
    </g>

    <!-- footer -->
    <line x1="40" y1="660" x2="1160" y2="660" stroke="#2f2f2f"/>
    <rect x="958" y="682" width="76" height="34" rx="6" fill="none" stroke="#3a3a3a"/>
    <text x="996" y="704" font-size="12.5" fill="#dcddde" text-anchor="middle">Cancel</text>

    <rect x="1044" y="678" width="172" height="42" rx="6" fill="#7c3aed"/>
    <g stroke="#ffffff" stroke-width="1.8" fill="none">
      <line x1="1066" y1="692" x2="1066" y2="704"/>
      <path d="M1061 700 L1066 706 L1071 700"/>
      <line x1="1058" y1="709" x2="1074" y2="709"/>
    </g>
    <text x="1082" y="704" font-size="13" font-weight="500" fill="#ffffff">Insert diagram</text>
    <rect x="1172" y="692" width="34" height="16" rx="3" fill="none" stroke="#ffffff" opacity="0.7"/>
    <text x="1189" y="703" font-size="9.5" fill="#ffffff" opacity="0.8" text-anchor="middle">Ctrl+↵</text>
  </g>

  <!-- resize handle -->
  <g stroke="#5a5a5a" stroke-width="1.2">
    <line x1="1146" y1="734" x2="1156" y2="724"/>
    <line x1="1152" y1="734" x2="1156" y2="730"/>
  </g>
</svg>
